<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시험기간 화이팅!</title>
<meta name="description" content="문제 풀기, 약점 보완 퀴즈, 오답노트, 시험 일정과 진도 관리">
<meta name="theme-color" content="#2f6df6">

<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시험화이팅">

<link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">시험</div>
      <div class="brand-text">
        <strong>시험기간 화이팅!</strong>
        <span id="brandSub">준비 중</span>
      </div>
    </div>

    <nav id="nav">
      <a href="#/home"      data-route="home">홈</a>
      <a href="#/schedule"  data-route="schedule">일정 · D-day</a>
      <a href="#/plan"      data-route="plan">공부 계획 · 진도</a>
      <div class="nav-sep">문제</div>
      <a href="#/quiz"      data-route="quiz">문제 풀기</a>
      <a href="#/weakness"  data-route="weakness">약점 보완 퀴즈</a>
      <a href="#/review"    data-route="review">오답노트 <span class="nav-badge" id="badgeWrong"></span></a>
      <div class="nav-sep">관리</div>
      <a href="#/stats"     data-route="stats">학습 통계</a>
      <a href="#/import"    data-route="import">자료로 문제 만들기</a>
      <a href="#/editor"    data-route="editor">문제 추가 · 편집</a>

      <div class="nav-sep">설정</div>
      <a href="#/account"   data-route="account">계정 · 동기화</a>
      <a href="#/data"      data-route="data">백업 · 초기화</a>
    </nav>

    <div class="sidebar-foot">
      <button id="themeBtn" class="btn btn-ghost btn-sm" type="button">테마 전환</button>
      <a class="btn btn-ghost btn-sm" href="../" title="소개 페이지로">안내</a>
    </div>
  </aside>

  <main class="main">
    <div id="view" class="view"></div>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<!--
  파일 뒤의 ?v=12 는 브라우저 캐시를 비우기 위한 것입니다.
  파일을 고쳐서 올릴 때 이 숫자와 sw.js 의 CACHE 버전을 같이 올리세요.
  안 올리면 브라우저가 예전 파일을 계속 씁니다.
-->

<!-- 데이터: 이 두 파일만 고치면 문제/과목이 바뀝니다 -->
<script src="data/curriculum.js?v=12"></script>
<script src="data/questions.js?v=12"></script>

<!-- 코어 -->
<script src="js/store.js?v=12"></script>
<script src="js/app.js?v=12"></script>
<script src="js/calendar.js?v=12"></script>
<script src="js/gcal.js?v=12"></script>
<script src="js/sync.js?v=12"></script>

<!-- 화면 -->
<script src="js/views/home.js?v=12"></script>
<script src="js/views/schedule.js?v=12"></script>
<script src="js/views/plan.js?v=12"></script>
<script src="js/views/quiz.js?v=12"></script>
<script src="js/views/weakness.js?v=12"></script>
<script src="js/views/review.js?v=12"></script>
<script src="js/views/stats.js?v=12"></script>
<script src="js/views/import.js?v=12"></script>
<script src="js/views/editor.js?v=12"></script>
<script src="js/views/account.js?v=12"></script>
<script src="js/views/data.js?v=12"></script>

<script>
App.start();
Sync.boot();          /* 로그인해 둔 상태면 조용히 이어서 동기화 */

/* 오프라인에서도 열리도록 (file:// 로 열었을 때는 건너뛴다) */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function (e) {
      console.warn("서비스 워커 등록 실패:", e);
    });
  });
}
</script>
</body>
</html>
