<style>
/* ---------- 색 — 디자인.md 1번 표 그대로 ---------- */

:root {
  color-scheme: light;

  --bg:        #f6f7f9;
  --surface:   #ffffff;
  --surface-2: #f0f2f5;
  --line:      #e2e5ea;

  --text:      #1a1d23;   /* 흰 바탕 대비 약 16:1 */
  --text-mid:  #5b6472;   /* 흰 바탕 대비 약 6:1 */
  --text-dim:  #8b94a3;   /* 3.1:1 — 읽어야 하는 글자에는 쓰지 않는다 */

  --accent:      #2f6df6;
  --ok:          #17864f;
  --ok-soft:     #e2f5eb;
  --bad:         #cf3b41;
  --bad-soft:    #fdebec;
  --warn:        #b7791f;
  --warn-soft:   #fdf3e0;

  --radius:    12px;
  --radius-sm: 8px;
  --shadow:    0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.05);

  --font: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;

    --bg:        #14161a;
    --surface:   #1c1f25;
    --surface-2: #23272e;
    --line:      #2f343c;

    --text:      #e8eaee;
    --text-mid:  #a3abb8;
    --text-dim:  #767f8d;

    --accent:      #5b8dff;
    --ok:          #4ec98a;
    --ok-soft:     #17352a;
    --bad:         #f0777c;
    --bad-soft:    #3a1f22;
    --warn:        #e0a94a;
    --warn-soft:   #35291b;

    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 400;          /* 디자인.md 6 — 300 이하는 쓰지 않는다 */
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;      /* 한글 단어가 줄 끝에서 잘리지 않게 */
}

/* ---------- 바탕 틀 — 디자인.md 3 ---------- */

.view {
  max-width: 1000px;
  margin: 0 auto;
  padding: 28px 28px 80px;
}

.page-head { margin-bottom: 22px; }
.page-head h1 { margin: 0 0 4px; font-size: 21px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
.page-head p  { margin: 0; color: var(--text-mid); font-size: 13.5px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);   /* 디자인.md 6 — 그림자는 카드 한 겹만 */
}

/* ---------- 문제 카드 안의 순서 1~7 — 디자인.md 3 ---------- */

/* 1. 위 줄 */
.q-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  margin-bottom: 6px;
}
.q-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.badge {
  font-size: 11px;
  font-weight: 600;
  line-height: 18px;
  padding: 0 8px;
  border-radius: 20px;
  background: var(--surface-2);
  color: var(--text-mid);
  white-space: nowrap;
}
.q-progress {
  font-size: 12.5px;
  color: var(--text-dim);      /* 못 읽어도 문제 푸는 데 지장 없는 자리 */
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* 2. 문제 지문 — 화면에서 제일 먼저 읽어야 하므로 본문보다 크다 */
.q-prompt {
  font-size: 16.5px;
  font-weight: 400;
  line-height: 1.65;
  margin: 6px 0 18px;
  word-break: keep-all;
}

/* 3. 선택지 — 항상 세로로 쌓는다 */
.choices { display: flex; flex-direction: column; gap: 8px; }

.choice {
  display: flex; gap: 10px; align-items: flex-start;
  width: 100%;
  min-height: 44px;            /* 디자인.md 3 — 손가락으로 누를 수 있는 높이 */
  text-align: left;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 11px 13px;
  font-size: 14px;
  font-weight: 400;
  font-family: inherit;
  color: var(--text);
  line-height: 1.55;
  cursor: pointer;
  word-break: keep-all;
  /* 디자인.md 6 — 허용되는 움직임은 색 전환뿐이다 */
  transition: background .12s, border-color .12s;
}
.choice:hover:not(:disabled) { background: var(--surface-2); }
.choice:disabled { cursor: default; }

.choice .idx {
  flex: 0 0 20px; height: 20px;
  border-radius: 5px;
  background: var(--surface-2);
  color: var(--text-mid);
  display: grid; place-items: center;
  font-size: 11px; font-weight: 600;   /* 디자인.md 2 — 11px 은 숫자 배지에만 */
  margin-top: 1px;
}

/* 맞음 = 초록, 틀림 = 빨강. 이 두 색을 다른 뜻으로 쓰지 않는다 */
.choice.correct { border-color: var(--ok);  background: var(--ok-soft); }
.choice.correct .idx { background: var(--ok);  color: #fff; }
.choice.wrong   { border-color: var(--bad); background: var(--bad-soft); }
.choice.wrong .idx   { background: var(--bad); color: #fff; }

/* OX 두 칸만 가로로 둔다 */
.ox-row { flex-direction: row; gap: 10px; }
.ox-row .choice { justify-content: center; font-size: 22px; font-weight: 700; padding: 22px; }
.ox-row .choice .idx { display: none; }

/* 4. 채점 결과 한 줄 — 언제나 선택지 바로 아래 같은 자리 */
.verdict {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  margin-top: 16px;
}
.verdict-ok  { background: var(--ok-soft);  color: var(--ok); }
.verdict-bad { background: var(--bad-soft); color: var(--bad); }

/* 5. 해설 — 채점하는 순간 펼쳐진 채로 나온다 */
.explain {
  margin-top: 12px;
  padding: 13px 15px;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 400;
  line-height: 1.7;
  color: var(--text-mid);
  word-break: keep-all;
}
.explain strong { color: var(--text); font-weight: 600; }

/* 6. 출처 한 줄 — 어느 파일 어느 절에서 나왔는지 */
.src {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
  font-size: 12.5px;
  color: var(--text-mid);      /* 읽어야 하는 글자이므로 --text-dim 을 쓰지 않는다 */
  overflow-wrap: anywhere;
}

/* 자료에서 근거를 찾지 못한 대목 */
.no-source {
  margin-top: 10px;
  padding: 7px 9px;
  border-radius: var(--radius-sm);
  background: var(--warn-soft);
  color: var(--warn);
  font-size: 12.5px;
  font-weight: 600;
}

/* 7. 맨 아래 버튼 줄 — 주 버튼은 언제나 오른쪽 끝 */
.btn-row {
  display: flex; gap: 8px; align-items: center;
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.btn-row .btn-primary { margin-left: auto; }

/* ---------- 버튼 — 디자인.md 5 ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px;            /* 누르는 자리 최소 44px */
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  font-size: 13.5px;
  font-weight: 400;
  font-family: inherit;
  line-height: 1.4;
  cursor: pointer;
  transition: background .12s, border-color .12s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #ffffff;
  font-weight: 600;            /* 흰 글자 대비가 4.5:1 턱걸이라 굵기를 낮추지 않는다 */
}
.btn-primary:hover:not(:disabled) { background: var(--accent); opacity: .9; }

/* ---------- 결과 화면 ---------- */

.score {
  font-size: 21px;                     /* 디자인.md 2 — 앱 안에서는 21px 이 최대 */
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1.3;
  margin: 0 0 4px;
}
.score-sub { margin: 0 0 18px; font-size: 13.5px; color: var(--text-mid); }

.section-head { margin: 22px 0 10px; }
.section-head h2 { margin: 0; font-size: 15px; font-weight: 600; }

.wrong-list { display: flex; flex-direction: column; }
.wrong-row {
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.wrong-row:last-child { border-bottom: none; }
.wrong-row .wr-title { font-size: 13.5px; }
.wrong-row .wr-sub { font-size: 12.5px; color: var(--text-mid); margin-top: 2px; }

.foot-note {
  margin-top: 26px;
  font-size: 12.5px;
  color: var(--text-mid);
  line-height: 1.7;
}

/* ---------- 폰 ---------- */

@media (max-width: 560px) {
  .view { padding: 16px 14px 64px; }
  .page-head { margin-bottom: 16px; }
  .page-head h1 { font-size: 19px; }

  .btn { padding: 9px 14px; }

  /* 주 버튼은 가로 전체로 늘린다 */
  .btn-row { flex-direction: column; align-items: stretch; }
  .btn-row .btn-primary { margin-left: 0; }

  .ox-row .choice { padding: 18px; }
}
</style>

/* ============================================================
   화면 그리기
   ============================================================ */

var picked = [];                 /* 각 문제에서 고른 번호. 안 풀었으면 null */
for (var i = 0; i < QUESTIONS.length; i++) { picked.push(null); }

var idx = 0;                     /* 지금 보고 있는 문제 */
var done = false;                /* 결과 화면인가 */

var screenEl = document.getElementById("screen");

function el(tag, className, text) {
  var node = document.createElement(tag);
  if (className) { node.className = className; }
  if (text !== undefined && text !== null) { node.textContent = text; }
  return node;
}

/* 맨위로 = true 일 때만 화면을 위로 올린다.
   채점할 때도 위로 올리면, 폰에서는 방금 나온 결과 줄과 해설이
   화면 밖으로 밀려서 다시 내려야 한다. 그래서 문제가 바뀔 때만 올린다. */
function render(맨위로) {
  screenEl.textContent = "";
  screenEl.appendChild(done ? buildResult() : buildQuestion());
  if (맨위로) { window.scrollTo(0, 0); }
}

/* ---------- 문제 카드 ---------- */

function buildQuestion() {
  var q = QUESTIONS[idx];
  var answered = picked[idx] !== null;

  var card = el("div", "card");

  /* 1. 위 줄 — 왼쪽 뱃지, 오른쪽 진행 표시 */
  var top = el("div", "q-top");
  var meta = el("div", "q-meta");
  meta.appendChild(el("span", "badge", "선박기관"));
  meta.appendChild(el("span", "badge", q.unit));
  meta.appendChild(el("span", "badge", q.type));
  meta.appendChild(el("span", "badge", "난이도 " + q.level));
  top.appendChild(meta);
  top.appendChild(el("span", "q-progress", (idx + 1) + " / " + QUESTIONS.length));
  card.appendChild(top);

  /* 2. 문제 지문 */
  card.appendChild(el("p", "q-prompt", q.q));

  /* 3. 선택지 — 세로로 쌓고, OX 만 가로 두 칸 */
  var list = el("div", "choices" + (q.type === "OX" ? " ox-row" : ""));
  for (var i = 0; i < q.choices.length; i++) {
    list.appendChild(buildChoice(q, i, answered));
  }
  card.appendChild(list);

  /* 4~6. 채점 결과 · 해설 · 출처 — 풀기 전에는 아예 그리지 않는다 */
  if (answered) {
    var right = picked[idx] === q.answer;

    var verdict = el("div", "verdict " + (right ? "verdict-ok" : "verdict-bad"));
    verdict.textContent = right
      ? "정답입니다"
      : "틀렸습니다 — 정답은 " + answerLabel(q) + " 입니다";
    card.appendChild(verdict);

    var explain = el("div", "explain");
    var head = el("strong", null, "해설 ");
    explain.appendChild(head);
    explain.appendChild(document.createTextNode(q.explain));

    if (q.missing) {
      explain.appendChild(el("div", "no-source", q.missing));
    }
    explain.appendChild(el("div", "src", "출처 — 실습파일/선박기관/" + q.src));
    card.appendChild(explain);
  }

  /* 7. 맨 아래 버튼 줄 — 주 버튼은 언제나 오른쪽 끝 */
  var row = el("div", "btn-row");

  var prev = el("button", "btn", "이전 문제");
  prev.type = "button";
  prev.disabled = (idx === 0);
  prev.addEventListener("click", function () {
    if (idx > 0) { idx--; render(true); }
  });
  row.appendChild(prev);

  var next = el("button", "btn btn-primary",
    idx === QUESTIONS.length - 1 ? "결과 보기" : "다음 문제");
  next.type = "button";
  next.addEventListener("click", function () {
    if (idx === QUESTIONS.length - 1) { done = true; }
    else { idx++; }
    render(true);
  });
  row.appendChild(next);

  card.appendChild(row);
  return card;
}

function buildChoice(q, i, answered) {
  var btn = el("button", "choice");
  btn.type = "button";

  var mark = el("span", "idx", String(i + 1));
  btn.appendChild(mark);
  btn.appendChild(el("span", null, q.choices[i]));

  if (answered) {
    btn.disabled = true;
    /* 맞았으면 고른 칸이 초록.
       틀렸으면 고른 칸이 빨강이고, 정답 칸도 초록으로 함께 보여 준다. */
    if (i === q.answer) { btn.className = "choice correct"; }
    else if (i === picked[idx]) { btn.className = "choice wrong"; }
  } else {
    btn.addEventListener("click", function () {
      if (picked[idx] !== null) { return; }
      picked[idx] = i;
      render();
    });
  }
  return btn;
}

function answerLabel(q) {
  return q.type === "OX" ? q.choices[q.answer] : (q.answer + 1) + "번";
}

/* ---------- 결과 화면 ---------- */

function buildResult() {
  var card = el("div", "card");

  var right = 0, unsolved = 0;
  for (var i = 0; i < QUESTIONS.length; i++) {
    if (picked[i] === null) { unsolved++; }
    else if (picked[i] === QUESTIONS[i].answer) { right++; }
  }

  card.appendChild(el("p", "score", QUESTIONS.length + "문제 중 " + right + "문제 정답"));
  card.appendChild(el("p", "score-sub",
    unsolved > 0 ? ("풀지 않은 문제 " + unsolved + "개는 오답으로 세지 않았습니다.")
                 : "모든 문제를 풀었습니다."));

  var wrong = [];
  for (var j = 0; j < QUESTIONS.length; j++) {
    if (picked[j] !== null && picked[j] !== QUESTIONS[j].answer) { wrong.push(j); }
  }

  var head = el("div", "section-head");
  head.appendChild(el("h2", null, wrong.length > 0 ? "틀린 문제" : "틀린 문제 없음"));
  card.appendChild(head);

  if (wrong.length > 0) {
    var list = el("div", "wrong-list");
    for (var k = 0; k < wrong.length; k++) {
      var n = wrong[k];
      var q = QUESTIONS[n];
      var rowEl = el("div", "wrong-row");
      rowEl.appendChild(el("div", "wr-title", (n + 1) + ". " + q.q));
      rowEl.appendChild(el("div", "wr-sub", q.unit + " · 정답 " + answerLabel(q)));
      list.appendChild(rowEl);
    }
    card.appendChild(list);
  } else {
    card.appendChild(el("p", "score-sub", "틀린 문제가 없습니다."));
  }

  var row = el("div", "btn-row");

  var back = el("button", "btn", "문제 다시 보기");
  back.type = "button";
  back.addEventListener("click", function () {
    done = false;
    idx = 0;
    render(true);
  });
  row.appendChild(back);

  var again = el("button", "btn btn-primary", "처음부터 다시 풀기");
  again.type = "button";
  again.addEventListener("click", function () {
    for (var i = 0; i < picked.length; i++) { picked[i] = null; }
    done = false;
    idx = 0;
    render(true);
  });
  row.appendChild(again);

  card.appendChild(row);
  return card;
}

render(true);
</script>

</body>
</html>
